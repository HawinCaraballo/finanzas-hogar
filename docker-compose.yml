services:
  db:
    image: postgres:16-alpine
    container_name: finanzas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas
      POSTGRES_DB: finanzas
    ports:
      - "5432:5432"
    volumes:
      - finanzas-pgdata:/var/lib/postgresql/data

volumes:
  finanzas-pgdata:
